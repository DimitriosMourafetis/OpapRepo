<!DOCTYPE html>
<html lang="el">
<head>
  <meta charset="UTF-8">
  <title>OPAP | Τοποθέτηση Στοιχήματος</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .category-section { margin-top: 20px; text-align: left; }
    .odds { padding: 10px; border: 1px solid #ccc; margin-bottom: 10px; }
    .odds div { margin-bottom: 5px; }
    .odds span { font-weight: bold; margin-right: 10px; }
    .hidden { display: none; }
  </style>
</head>
<body>
  <div class="login-container">
    <img src="oap.png" alt="OPAP Logo" class="logo">
    <h2>Τοποθέτηση Στοιχήματος</h2>

    <label for="sport">Άθλημα:</label>
    <select id="sport" onchange="showSport()">
      <option value="">Επιλογή</option>
      <option value="football">Ποδόσφαιρο</option>
      <option value="basketball">Μπάσκετ</option>
      <option value="tennis">Τένις</option>
    </select>

    <label for="region">Περιοχή:</label>
    <select id="region" onchange="showMatches()">
      <option value="">Επιλογή</option>
      <option value="greece">Ελλάδα</option>
      <option value="abroad">Εξωτερικό</option>
    </select>

    <div id="matches" class="category-section hidden"></div>

    <label for="amount">Ποσό Στοιχήματος (€):</label>
    <input type="number" id="amount" min="0.5" max="10000" step="0.1" placeholder="0.50 - 10000" oninput="calculateCashOut()">

    <p id="selected-bet" class="hidden">Επιλεγμένη Απόδοση: <span id="selected-odds">0</span></p>
    <p id="cashout" class="hidden">Πιθανό Cash Out: €<span id="cashout-amount">0</span></p>

    <button onclick="placeBet()">Τοποθέτηση</button><br><br>
    <a href="dashboard.html">Επιστροφή</a>
  </div>

    };

    function showSport() {
      document.getElementById("region").value = "";
      document.getElementById("matches").classList.add("hidden");
      document.getElementById("matches").innerHTML = "";
      document.getElementById("selected-bet").classList.add("hidden");
      document.getElementById("cashout").classList.add("hidden");
    }

    function showMatches() {
      const sport = document.getElementById("sport").value;
      const region = document.getElementById("region").value;
      const container = document.getElementById("matches");
      container.innerHTML = "";
      if (sport && region && data[sport] && data[sport][region]) {
        const list = data[sport][region];
        list.forEach(([team1, odds1, team2, odds2]) => {
          const div = document.createElement("div");
          div.className = "odds";
          div.innerHTML = `
            <div>
              <span>${team1}</span> (Απόδοση: ${odds1})
              <button onclick="selectOdds(${odds1})">Επιλογή</button>
            </div>
            <div>
              <span>${team2}</span> (Απόδοση: ${odds2})
              <button onclick="selectOdds(${odds2})">Επιλογή</button>
            </div>
          `;
          container.appendChild(div);
        });
        container.classList.remove("hidden");
      }
    }

    let selectedOdds = 0;
    function selectOdds(odds) {
      selectedOdds = odds;
      document.getElementById("selected-odds").textContent = odds;
      document.getElementById("selected-bet").classList.remove("hidden");
      calculateCashOut();
    }

    function calculateCashOut() {
      const amount = parseFloat(document.getElementById("amount").value);
      if (!selectedOdds || isNaN(amount) || amount < 0.5 || amount > 10000) {
        document.getElementById("cashout").classList.add("hidden");
        return;
      }
      const cashOut = (amount * selectedOdds).toFixed(2);
      document.getElementById("cashout-amount").textContent = cashOut;
      document.getElementById("cashout").classList.remove("hidden");
    }

    function placeBet() {
      if (!selectedOdds) {
        alert("Παρακαλώ επιλέξτε ομάδα.");
        return;
      }
      alert("Το στοίχημα τοποθετήθηκε με επιτυχία!");
      window.location.href = "dashboard.html";
    }
  </script>
</body>
</html>
