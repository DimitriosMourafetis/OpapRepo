<!DOCTYPE html>
<html lang="el">
<head>
  <meta charset="UTF-8">
  <title>OPAP | Σύνδεση</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="login-container">
    <img src="oap.png" alt="OPAP Logo" class="logo">
    <h2>Καλώς ήρθατε στην εφαρμογή OPAP</h2>
    <form action="dashboard.html">
      <input type="text" placeholder="Όνομα Χρήστη" required>
      <input type="password" placeholder="Κωδικός" required>
      <select required>
        <option disabled selected>Επιλογή Ρόλου</option>
        <option>Πελάτης</option>
        <option>Διευθυντής</option>
      </select>
      <button type="submit">Σύνδεση</button>
    </form>
    <a href="signup.html">Δεν έχετε λογαριασμό; Εγγραφή</a><br>
    <a href="forgot.html">Ξεχάσατε τον κωδικό σας;</a>
  </div>
</body>
</html>
