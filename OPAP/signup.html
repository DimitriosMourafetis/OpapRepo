<!DOCTYPE html>
<html lang="el">
<head>
  <meta charset="UTF-8">
  <title>OPAP | Εγγραφή</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="login-container">
    <img src="oap.png" alt="OPAP Logo" class="logo">
    <h2>Εγγραφή Χρήστη</h2>
    <form action="dashboard.html">
      <input type="text" placeholder="Όνομα Χρήστη" required>
      <input type="email" placeholder="Email" required>
      <input type="password" placeholder="Κωδικός" required>
      <select required>
        <option disabled selected>Επιλογή Ρόλου</option>
        <option>Πελάτης</option>
        <option>Διευθυντής</option>
      </select>
      <button type="submit">Εγγραφή</button>
    </form>
    <a href="index.html">Επιστροφή στη Σύνδεση</a>
  </div>
</body>
</html>
